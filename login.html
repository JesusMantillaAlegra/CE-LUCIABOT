<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Iniciar sesión | Alegra</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #00897B 0%, #26C6B0 40%, #4DD9C8 75%, #80E8DC 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 48px 44px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,.15);
    text-align: center;
  }
  .logo-text {
    font-family: 'Lexend', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #1A2B4A;
    margin-bottom: 24px;
  }
  h1 { font-family: 'Lexend', sans-serif; font-size: 20px; font-weight: 700; color: #18283F; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: #64748B; margin-bottom: 36px; line-height: 1.5; }
  .btn-google {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; padding: 14px 20px; border: 1.5px solid #E2E8F0; border-radius: 12px;
    background: #fff; color: #18283F; font-family: 'Inter', sans-serif; font-size: 15px;
    font-weight: 500; cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s, box-shadow .15s;
  }
  .btn-google:hover { background: #F8FAFC; border-color: #00D6BC; box-shadow: 0 4px 16px rgba(0,214,188,.15); }
  .domain-badge {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 20px; padding: 6px 12px;
    background: #F0FDF9; border: 1px solid #CCFBF1; border-radius: 20px; font-size: 12px; color: #0F766E; font-weight: 500;
  }
  .error-msg { margin-bottom: 20px; padding: 10px 16px; background: #FEF2F2; border: 1px solid #FECACA; border-radius: 10px; color: #DC2626; font-size: 13px; }
  .footer-text { margin-top: 32px; font-size: 11px; color: #94A3B8; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-text">alegra</div>
    <h1>Valentina · CHS Feedback</h1>
    <p class="subtitle">Acceso restringido al equipo Alegra.<br/>Inicia sesión con tu cuenta corporativa.</p>

    <div id="error-box" style="display:none" class="error-msg"></div>

    <a id="btn-google" class="btn-google" href="/api/auth/login">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C1.22 15.89 0 19.88 0 24c0 4.12 1.22 7.97 3.27 11.2l7.26-6.61z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Iniciar sesión con Google
    </a>

    <div class="domain-badge">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
      </svg>
      Solo cuentas @alegra.com
    </div>

    <p class="footer-text">Al iniciar sesión aceptás los términos de uso internos de Alegra.</p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const err = params.get('error');
    const msgs = {
      domain_not_allowed: 'Acceso denegado. Solo se permiten cuentas @alegra.com.',
      oauth_denied:       'Autenticación cancelada. Intenta de nuevo.',
      token_failed:       'Error al obtener el token. Intenta de nuevo.',
      state_mismatch:     'Error de seguridad. Intenta de nuevo.',
    };
    if (err) {
      const box = document.getElementById('error-box');
      box.textContent = msgs[err] || 'Error al iniciar sesión. Intenta de nuevo.';
      box.style.display = 'block';
    }

    // Si ya hay sesión activa, saltar directo al dashboard
    fetch('/api/auth/me', { credentials: 'include' })
      .then(r => { if (r.ok) window.location.replace('/'); })
      .catch(() => {});
  </script>
</body>
</html>
